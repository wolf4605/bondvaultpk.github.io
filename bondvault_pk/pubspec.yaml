name: bondvault_pk
description: "BondVault PK Mobile App."
publish_to: 'none'

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#003527"
  adaptive_icon_foreground: "assets/logo.png"

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_svg: ^2.0.10+1
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  image_picker: ^1.1.2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
